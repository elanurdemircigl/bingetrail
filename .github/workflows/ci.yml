name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      # setup-node v5 adds automatic package-manager caching; keep the pnpm store
      # cache explicit so behaviour stays identical to v4.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint, typecheck (incl. Expo), unit tests
        run: pnpm turbo run lint typecheck test

      - name: Typecheck root tooling (Playwright, security scripts)
        run: pnpm run typecheck:root

      - name: Security scanner tests
        run: pnpm run test:security

      - name: Shared contracts are in sync with Edge Functions
        run: pnpm run contracts:check

      # Same Deno version as the Supabase edge runtime (see tooling/scripts/deno-test.mjs).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4

      - name: Edge Functions type-check and tests
        run: pnpm run test:functions

  e2e:
    name: Web build, bundle security, E2E (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Auth, REST, Storage (avatar removal on account deletion), gateway, mail
      # catcher and the edge runtime are what E2E needs. The functions are served
      # by Playwright with a TMDB mock and a throwaway deletion salt
      # (e2e/tmdb-mock/start-services.mjs) — no real secrets in CI.
      - name: Start local Supabase
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,realtime,logflare,vector,supavisor,postgres-meta
          > /dev/null

      # Public URL + publishable key come from the local stack via the wrapper;
      # nothing is printed or written to disk. No mobile/EAS build (Faz 10).
      - name: Build web
        run: pnpm run build:web:local

      - name: Secret bundle guard + public env check (with real public env)
        run: pnpm run security:check:local

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (auth, access control, i18n, catalog, watchlist, account deletion)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Database (migrations, pgTAP, advisors, types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (Supabase CLI is a pinned devDependency)
        run: pnpm install --frozen-lockfile

      # Postgres only; the full local stack is not needed for schema checks.
      # A fresh `db start` applies every migration and the seed exactly once.
      - name: Start local Postgres (applies migrations + seed)
        run: pnpm exec supabase db start

      - name: Lint SQL functions
        run: pnpm run db:lint

      - name: pgTAP (schema, RLS isolation, account deletion)
        run: pnpm run db:test

      - name: Security and performance advisors (fail on WARN or ERROR)
        run: pnpm run db:advisors

      - name: Generated types match the schema
        run: |
          pnpm run db:types
          git diff --exit-code -- packages/db-types/src/database.types.ts

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
