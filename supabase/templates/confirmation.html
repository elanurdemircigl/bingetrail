<!doctype html>
<html>
  <body style="font-family: system-ui, sans-serif; color: #16161f">
    <h2>BingeTrail</h2>
    <p>Hesabını etkinleştirmek için e-posta adresini doğrula:</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&locale={{ .Data.locale }}"
      >
        E-postamı doğrula
      </a>
    </p>
    <p style="color: #6b6b76">Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin.</p>
    <hr />
    <p>Confirm your email address to activate your account:</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&locale={{ .Data.locale }}"
      >
        Confirm my email
      </a>
    </p>
    <p style="color: #6b6b76">If you did not request this, you can ignore this email.</p>
  </body>
</html>
